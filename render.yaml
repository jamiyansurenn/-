# Blueprint: https://render.com/docs/blueprint-spec
# After push: Render Dashboard → your Blueprint → Manual sync (or create resources from this file).
databases:
  - name: daatsin-tsamkhag-db
    plan: free
    databaseName: moncon
    user: moncon

services:
  - type: web
    name: daatsin-tsamkhag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: daatsin-tsamkhag-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_INTERNAL_HOST_SUFFIX
        value: singapore-postgres.render.com
      - key: STORAGE_DRIVER
        value: local
      # First deploy only: set RUN_PRISMA_SEED=1 once, then remove or set to 0.
      - key: RUN_PRISMA_SEED
        value: "0"
      - key: SEED_RESET_DEFAULT_PASSWORDS
        value: "false"
