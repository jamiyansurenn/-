# Blueprint: https://render.com/docs/blueprint-spec
# After push: Render Dashboard → your Blueprint → Manual sync (or create resources from this file).
databases:
  - name: daatsin-tsamkhag-db
    plan: free
    databaseName: moncon
    user: moncon

services:
  - type: web
    name: daatsin-tsamkhag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: daatsin-tsamkhag-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
