services:
  # Backend API Service
  - type: web
    name: daatsin-tsamkhag-backend
    env: node
    plan: free
    # Schema targets PostgreSQL; legacy migrations in repo are SQLite. Use db push until a Postgres migration baseline is added.
    buildCommand: cd backend && npm install --include=dev && npx prisma db push && npm run prisma:seed && npm run build
    startCommand: cd backend && node dist/src/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set this to your Vercel Frontend URL (e.g. https://your-project.vercel.app)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
    healthCheckPath: /health

